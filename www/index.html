<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice AI</title>
<meta name="theme-color" content="#0a081e">
<style>
  :root {
    --bg: #0a081e;
    --ink: #f1efff;
    --ink-dim: #a29fd0;
    --line: rgba(255, 255, 255, 0.12);
    --glass: rgba(24, 20, 58, 0.55);
    --a: #7a6bff;
    --b: #d05cff;
    --c: #ff8f7e;
    --radius: 20px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    overflow-y: auto;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1100px 700px at 50% 48%, #1d1750 0%, var(--bg) 62%);
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ---------- top: what you said + what the AI said ---------- */
  .top {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 140px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1;
  }

  .card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  .label {
    margin: 0 0 6px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  #out {
    margin: 0;
    min-height: 1.4em;
    font-size: clamp(1.05rem, 4vw, 1.3rem);
    font-weight: 300;
    color: #cfcaff;
  }

  #reply {
    max-height: 28vh;
    overflow-y: auto;
    padding-right: 8px;
    font-size: clamp(1.15rem, 4.4vw, 1.5rem);
    line-height: 1.4;
    font-weight: 400;
  }
  #reply:empty::before {
    content: "The reply will show up here";
    color: var(--ink-dim);
    font-weight: 300;
  }

  /* ---------- custom scrollbar ---------- */
  .scroll { scrollbar-width: thin; scrollbar-color: rgba(160, 140, 255, 0.55) transparent; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--a), var(--b));
    border-radius: 8px;
  }

  /* ---------- bottom: controls ---------- */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 12px 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 1;
    background: rgba(10, 8, 30, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }

  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font: inherit;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }

  .primary {
    padding: 14px 36px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--a), var(--b) 60%, var(--c));
    box-shadow: 0 8px 30px rgba(150, 100, 255, 0.45);
  }

  .primary.live { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(208, 92, 255, 0.55), 0 8px 30px rgba(150, 100, 255, 0.45); }
    70%  { box-shadow: 0 0 0 20px rgba(208, 92, 255, 0), 0 8px 30px rgba(150, 100, 255, 0.45); }
    100% { box-shadow: 0 0 0 0 rgba(208, 92, 255, 0), 0 8px 30px rgba(150, 100, 255, 0.45); }
  }

  .ghost {
    padding: 10px 18px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* ---------- input & dropdown ---------- */
  .input-wrap, .select-wrap { width: min(440px, 90vw); }

  input[type="password"] {
    width: 100%;
    padding: 10px 16px;
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 10px 44px 10px 16px;
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23a29fd0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 18px center;
    text-overflow: ellipsis;
  }
  select option { background: #15113a; color: #f1efff; }

  /* ---------- status line ---------- */
  #note {
    margin: 0;
    max-width: 90vw;
    min-height: 1.1em;
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .primary.live { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <main class="top">
    <section class="card">
      <p class="label">You</p>
      <p id="out">Tap Talk and speak</p>
    </section>
    <section class="card">
      <p class="label">AI</p>
      <div id="reply" class="scroll"></div>
    </section>
  </main>

  <footer class="dock">
    <div class="controls">
      <button id="talk" class="btn primary">Talk</button>
      <button id="save-key" class="btn ghost">Save Key</button>
    </div>
    <div class="input-wrap">
      <input type="password" id="gemini-key-input" placeholder="Paste Gemini API Key here" />
    </div>
    <div class="select-wrap"><select id="voices"></select></div>
    <p id="note"></p>
  </footer>

  <script>
    const MODEL = 'gemini-2.5-flash';
    const SYSTEM = 'You are a voice assistant. Reply in one to three short sentences, in plain spoken language, with no lists or formatting.';
    let history = [];

    const PLUGINS = (window.Capacitor && window.Capacitor.Plugins) || {};
    const SRPlugin = PLUGINS.SpeechRecognition;
    const TTSPlugin = PLUGINS.TextToSpeech;

    const out = document.getElementById('out');
    const reply = document.getElementById('reply');
    const talk = document.getElementById('talk');
    const note = document.getElementById('note');
    const voiceSel = document.getElementById('voices');
    const keyInput = document.getElementById('gemini-key-input');
    const saveKeyBtn = document.getElementById('save-key');

    // Load saved key on startup
    const storedKey = localStorage.getItem('gemini_key');
    if (storedKey) {
      keyInput.value = storedKey;
    }

    saveKeyBtn.onclick = () => {
      const val = keyInput.value.trim();
      if (val) {
        localStorage.setItem('gemini_key', val);
        note.textContent = 'API key saved successfully!';
        setTimeout(() => { showNote(); }, 2500);
      } else {
        localStorage.removeItem('gemini_key');
        note.textContent = 'API key cleared.';
      }
    };

    // ---------- BLOB ----------
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resize();
    window.onresize = resize;

    let state = 'idle';
    let level = 0;
    let kick = 0;

    function setState(s) { state = s; }

    function draw() {
      const t = performance.now() / 1000;
      let target = 0;

      if (state === 'listening') {
        target = 0.14 + 0.1 * Math.sin(t * 5) + 0.6 * kick;
      } else if (state === 'thinking') {
        target = 0.12 + 0.1 * Math.sin(t * 3);
      } else if (state === 'speaking') {
        target = 0.2 + 0.45 * Math.abs(Math.sin(t * 6.5)) * (0.6 + 0.4 * Math.sin(t * 1.7));
      }
      kick *= 0.9;
      target = Math.max(0, Math.min(1, target));
      level += (target - level) * 0.15;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const base = Math.min(canvas.width, canvas.height) * (0.16 + level * 0.25);
      const amp = 0.04 + level * 0.3;
      const N = 100;
      const pts = [];

      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const w = 1
          + 0.05 * Math.sin(2 * a + t * 0.8)
          + 0.04 * Math.sin(3 * a - t * 1.1)
          + amp * Math.sin(3 * a + t * 3)
          + amp * 0.5 * Math.sin(5 * a - t * 4);
        const r = base * w;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }

      const last = pts[N - 1];
      ctx.beginPath();
      ctx.moveTo((last[0] + pts[0][0]) / 2, (last[1] + pts[0][1]) / 2);
      for (let i = 0; i < N; i++) {
        const p = pts[i];
        const q = pts[(i + 1) % N];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      ctx.closePath();

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * 1.4);
      g.addColorStop(0, '#ff7ad9');
      g.addColorStop(0.5, '#9a5cff');
      g.addColorStop(1, '#3a3cff');

      ctx.shadowColor = 'rgba(150, 100, 255, 0.8)';
      ctx.shadowBlur = 30 + level * 60;
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowBlur = 0;

      requestAnimationFrame(draw);
    }
    draw();

    // ---------- MOUTH ----------
    let voices = [];
    let speakId = 0;

    function addOption(value, label) {
      const o = document.createElement('option');
      o.value = value;
      o.textContent = label;
      voiceSel.appendChild(o);
    }

    function showNote() {
      if (voiceSel.value === 'none') {
        note.textContent = 'Voice is off. Replies are text only.';
      } else if (voiceSel.value === 'auto') {
        note.textContent = "Speaking with the phone's default voice.";
      } else {
        const v = voices[Number(voiceSel.value)];
        note.textContent = v ? 'Speaking with: ' + v.name + ' (' + v.lang + ')' : '';
      }
    }

    async function loadVoices() {
      voiceSel.innerHTML = '';
      addOption('none', 'No voice (text only)');
      addOption('auto', "Auto: phone's default voice");
      try {
        const res = await TTSPlugin.getSupportedVoices();
        voices = res.voices || [];
        voices.forEach((v, i) => {
          if (v.lang && v.lang.toLowerCase().startsWith('en')) {
            addOption(String(i), v.name + ' (' + v.lang + ')');
          }
        });
      } catch (e) {
        note.textContent = 'Could not load voices: ' + (e.message || e);
      }

      const saved = localStorage.getItem('voice_choice') || 'auto';
      if (saved === 'none' || saved === 'auto') {
        voiceSel.value = saved;
      } else {
        const idx = voices.findIndex(v => v.name === saved);
        voiceSel.value = idx >= 0 ? String(idx) : 'auto';
      }
      showNote();
    }
    loadVoices();

    async function speak(text) {
      const id = ++speakId;
      if (voiceSel.value === 'none') { setState('idle'); return; }

      setState('speaking');
      try {
        const opts = { text: text, lang: 'en-US', rate: 1.0, pitch: 1.0 };
        if (voiceSel.value !== 'auto') {
          const v = voices[Number(voiceSel.value)];
          if (v) { opts.voice = Number(voiceSel.value); opts.lang = v.lang; }
        }
        await TTSPlugin.speak(opts);
      } catch (e) {
        note.textContent = 'Voice error: ' + (e.message || e);
      }
      if (id === speakId && state === 'speaking') setState('idle');
    }

    function stopSpeaking() {
      speakId++;
      try { TTSPlugin.stop().catch(() => {}); } catch (e) {}
      if (state === 'speaking') setState('idle');
    }

    voiceSel.onchange = () => {
      const val = voiceSel.value;
      if (val === 'none' || val === 'auto') {
        localStorage.setItem('voice_choice', val);
      } else {
        const v = voices[Number(val)];
        if (v) localStorage.setItem('voice_choice', v.name);
      }
      showNote();
      stopSpeaking();
    };

    // ---------- KEY ----------
    function getKey() {
      const key = keyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_key', key);
      }
      return key;
    }

    // ---------- BRAIN ----------
    async function ask(text) {
      const key = getKey();
      if (!key) { 
        reply.textContent = 'Please enter and save your Gemini API key below.'; 
        setState('idle'); 
        return; 
      }

      setState('thinking');
      reply.textContent = 'Thinking…';
      history.push({ role: 'user', parts: [{ text }] });

      try {
        const r = await fetch(
          'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent',
          {
            method: 'POST',
            headers: {
              'x-goog-api-key': key,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM }] },
              contents: history
            })
          }
        );

        const data = await r.json();
        if (!r.ok) {
          const msg = (data.error && data.error.message) || 'API error';
          throw new Error(msg);
        }

        const parts = data.candidates?.[0]?.content?.parts || [];
        const answer = parts.map(p => p.text || '').join('').trim();
        if (!answer) throw new Error('Empty reply (it may have been blocked).');

        history.push({ role: 'model', parts: [{ text: answer }] });
        reply.textContent = answer;
        speak(answer);
      } catch (e) {
        history.pop();
        reply.textContent = 'Error: ' + e.message;
        setState('idle');
      }
    }

    // ---------- EARS ----------
    let listening = false;
    let lastText = '';
    let silenceTimer = null;

    function resetButton() {
      talk.textContent = 'Talk';
      talk.classList.remove('live');
    }

    async function finishListening() {
      if (!listening) return;
      listening = false;
      clearTimeout(silenceTimer);
      try { await SRPlugin.stop(); } catch (e) {}
      resetButton();

      const text = lastText;
      lastText = '';
      if (text) ask(text);
      else setState('idle');
    }

    async function startListening() {
      stopSpeaking();

      try {
        const av = await SRPlugin.available();
        if (av && av.available === false) {
          out.textContent = 'Speech recognition is not available on this phone.';
          return;
        }
        const perm = await SRPlugin.requestPermissions();
        if (perm.speechRecognition !== 'granted') {
          out.textContent = 'The microphone permission is needed. Allow it in the phone settings.';
          return;
        }

        lastText = '';
        out.textContent = 'Listening…';
        listening = true;
        setState('listening');
        talk.textContent = 'Listening… (tap to stop)';
        talk.classList.add('live');

        await SRPlugin.removeAllListeners();
        await SRPlugin.addListener('partialResults', (data) => {
          if (!listening || !data || !data.matches || !data.matches.length) return;
          lastText = data.matches[0];
          out.textContent = lastText;
          kick = 1;
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(finishListening, 1600);
        });

        silenceTimer = setTimeout(finishListening, 8000);

        await SRPlugin.start({
          language: 'en-US',
          maxResults: 1,
          partialResults: true,
          popup: false
        });
      } catch (e) {
        out.textContent = 'Error: ' + (e.message || e);
        listening = false;
        clearTimeout(silenceTimer);
        resetButton();
        setState('idle');
      }
    }

    talk.onclick = () => {
      if (!SRPlugin || !TTSPlugin) return;
      if (state === 'thinking') return;
      if (listening) finishListening();
      else startListening();
    };

    if (!SRPlugin || !TTSPlugin) {
      out.textContent = 'Speech plugins not found. This page only works inside the Android app.';
    }
  </script>
</body>
</html>
